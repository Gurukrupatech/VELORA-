<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Journal</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f4f4f4;
 color:#111;
 font-family:Arial,sans-serif;
}

.header{
 height:58px;
 background:#071018;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 14px;
}

.header button{
 background:none;
 border:0;
 color:#fff;
 font-size:34px;
 line-height:1;
}

.header h2{
 margin:0;
 font-size:20px;
}

.page{
 width:100%;
 max-width:700px;
 margin:auto;
 background:#fff;
 padding:8px;
}

.datetime{
 text-align:right;
 font-size:11px;
 font-weight:bold;
 color:#555;
 height:22px;
 padding-right:3px;
}

.banner{
 background:linear-gradient(120deg,#071923,#123b3a,#071923);
 border:1px solid #123;
 height:92px;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 margin-bottom:8px;
}

.ss{
 width:65px;
 height:65px;
 border:3px solid #f1c542;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#f1c542;
 font-size:25px;
 font-weight:bold;
 margin-right:12px;
}

.brand{
 color:#f1c542;
 font-size:22px;
 font-weight:bold;
}

.brand small{
 display:block;
 color:#fff;
 font-size:13px;
 margin-top:7px;
 letter-spacing:1px;
}

.info{
 border:1px solid #777;
 display:grid;
 grid-template-columns:1fr 1fr;
}

.info div{
 min-height:55px;
 padding:8px;
 border-bottom:1px solid #aaa;
 font-size:12px;
 font-weight:bold;
}

.info div:nth-child(odd){
 border-right:1px solid #aaa;
}

.info div:nth-last-child(-n+2){
 border-bottom:0;
}

.line{
 width:65%;
 border:0;
 border-bottom:1px solid #777;
 outline:0;
 padding:3px;
 background:transparent;
 font-size:12px;
}

table{
 width:100%;
 border-collapse:collapse;
 margin-top:8px;
 table-layout:fixed;
}

th{
 background:#071923;
 color:white;
 border:1px solid #c8a83e;
 padding:7px 2px;
 font-size:11px;
}

td{
 height:39px;
 border:1px solid #aaa;
}

td input{
 width:100%;
 height:100%;
 border:0;
 outline:0;
 text-align:center;
 font-size:11px;
 padding:2px;
}

.two{
 display:grid;
 grid-template-columns:2fr .75fr;
 gap:7px;
 margin-top:8px;
}

.section{
 border:1px solid #777;
}

.title{
 background:#23783f;
 color:white;
 text-align:center;
 padding:7px;
 font-size:12px;
 font-weight:bold;
}

.yellow{
 background:#dfb43d;
 color:#111;
}

.tradeclose{
 padding:8px;
}

.tradeclose label{
 display:flex;
 align-items:center;
 font-size:12px;
 font-weight:bold;
 margin:8px 0;
}

.tradeclose input{
 flex:1;
 margin-left:6px;
 border:0;
 border-bottom:1px solid #777;
 outline:0;
}

.watch{
 padding:4px 8px 7px;
}

.watch input{
 width:100%;
 border:0;
 border-bottom:1px solid #aaa;
 outline:0;
 padding:7px 2px;
 font-size:11px;
}

.obs{
 margin-top:8px;
}

.obsgrid{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
}

.obsgrid div{
 border-right:1px solid #aaa;
}

.obsgrid div:last-child{
 border-right:0;
}

.obsgrid h3{
 margin:0;
 text-align:center;
 padding:7px 2px;
 font-size:11px;
 border-bottom:1px solid #aaa;
}

textarea{
 width:100%;
 border:0;
 outline:0;
 resize:none;
 padding:7px;
 font-family:Arial,sans-serif;
 font-size:11px;
 min-height:82px;
}

.notes{
 margin-top:8px;
}

.notes textarea{
 min-height:105px;
}

.save{
 width:100%;
 margin-top:9px;
 height:58px;
 border:0;
 border-radius:12px;
 background:#0c1821;
 color:#fff;
 font-size:18px;
 font-weight:bold;
}

.status{
 text-align:center;
 color:#23783f;
 font-size:12px;
 font-weight:bold;
 height:20px;
 padding-top:5px;
}

/* SAVED NOTES */

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.72);
 z-index:50;
 padding:12px;
}

.modal.show{
 display:block;
}

.panel{
 background:#fff;
 max-width:600px;
 margin:25px auto;
 border-radius:12px;
 overflow:hidden;
 max-height:88vh;
}

.panelhead{
 background:#071923;
 color:#fff;
 padding:14px;
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.panelhead h2{
 margin:0;
 font-size:19px;
}

.close{
 background:none;
 border:0;
 color:#fff;
 font-size:28px;
}

.saved{
 padding:10px;
 overflow:auto;
}

.deleteall{
 width:100%;
 border:0;
 border-radius:8px;
 background:#c83232;
 color:#fff;
 padding:11px;
 font-weight:bold;
 margin-bottom:10px;
}

.card{
 border:1px solid #bbb;
 border-radius:9px;
 padding:10px;
 margin-bottom:9px;
}

.cardtitle{
 font-size:16px;
 font-weight:bold;
}

.cardtime{
 color:#666;
 font-size:10px;
 margin:5px 0;
}

.preview{
 font-size:12px;
 white-space:pre-wrap;
 margin-bottom:8px;
}

.card button{
 border:0;
 border-radius:6px;
 padding:8px 12px;
 font-weight:bold;
 margin-right:5px;
}

.open{
 background:#e2b63f;
}

.del{
 background:#c83232;
 color:#fff;
}

.empty{
 text-align:center;
 color:#777;
 padding:30px 10px;
}

/* MOBILE */

@media(max-width:480px){

.page{
 padding:6px;
}

.banner{
 height:78px;
}

.ss{
 width:54px;
 height:54px;
 font-size:21px;
 margin-right:9px;
}

.brand{
 font-size:17px;
}

.brand small{
 font-size:10px;
 margin-top:5px;
}

th{
 font-size:9px;
 padding:6px 1px;
}

td{
 height:34px;
}

td input{
 font-size:9px;
}

.info div{
 font-size:10px;
 min-height:50px;
 padding:7px;
}

.line{
 font-size:10px;
 width:60%;
}

.title{
 font-size:11px;
 padding:6px;
}

.tradeclose label{
 font-size:10px;
}

.obsgrid h3{
 font-size:9px;
}

textarea{
 font-size:10px;
 min-height:75px;
}

.notes textarea{
 min-height:95px;
}

.save{
 height:54px;
 font-size:17px;
}

.datetime{
 font-size:10px;
}
}
</style>
</head>

<body>

<div class="header">
<button onclick="goBack()">‹</button>
<h2>Trading Journal</h2>
<button onclick="openSaved()">⋮</button>
</div>

<div class="page">

<div class="datetime">
🕒 <span id="clock"></span>
</div>

<div class="banner">

<div class="ss">SS</div>

<div class="brand">
GURUKRUPATECH
<small>TRADING JOURNAL</small>
</div>

</div>

<!-- DETAILS -->

<div class="info">

<div>
Date:
<input id="date" class="line" readonly>
</div>

<div>
Closed P/L:
<input class="line" data-key="closed">
</div>

<div>
Day:
<input id="day" class="line" readonly>
</div>

<div>
Total Brokerage:
<input class="line" data-key="brokerage">
</div>

<div>
Starting A/C Balance:
<input class="line" data-key="starting">
</div>

<div>
Closing A/C Balance:
<input class="line" data-key="closing">
</div>

</div>

<!-- TRADES -->

<table>

<thead>
<tr>
<th>Name</th>
<th>Buy</th>
<th>Sell</th>
<th>Qty</th>
<th>Target</th>
<th>SL</th>
<th>P/L</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

<!-- PROFIT WATCHLIST -->

<div class="two">

<div class="section">

<div class="title">
AFTER TRADE CLOSE
</div>

<div class="tradeclose">

<label>
Profit:
<input data-key="profit">
</label>

<label>
Loss:
<input data-key="loss">
</label>

</div>

</div>

<div class="section">

<div class="title yellow">
WATCHLIST
</div>

<div class="watch">

<input data-key="watch1">
<input data-key="watch2">
<input data-key="watch3">

</div>

</div>

</div>

<!-- OBSERVATION -->

<div class="section obs">

<div class="title yellow">
MY OBSERVATIONS
</div>

<div class="obsgrid">

<div>
<h3>Market Movement</h3>
<textarea data-key="movement"></textarea>
</div>

<div>
<h3>Mistakes</h3>
<textarea data-key="mistakes"></textarea>
</div>

<div>
<h3>Risk/Reward</h3>
<textarea data-key="risk"></textarea>
</div>

</div>

</div>

<!-- NOTES -->

<div class="section notes">

<div class="title">
NOTES
</div>

<textarea
data-key="notes"
placeholder="Write your notes here..."
></textarea>

</div>

<button class="save" onclick="saveNote()">
💾 SAVE
</button>

<div class="status" id="status"></div>

</div>


<!-- SAVED NOTES -->

<div class="modal" id="savedModal">

<div class="panel">

<div class="panelhead">

<h2>Saved Notes</h2>

<button class="close" onclick="closeSaved()">×</button>

</div>

<div class="saved" id="savedList"></div>

</div>

</div>


<script>

const KEY="GURU_TRADING_JOURNAL";

let deleteId=null;


/* CREATE TRADING ROWS */

const rowBox=document.getElementById("rows");

for(let i=0;i<6;i++){

let tr=document.createElement("tr");

["Name","Buy","Sell","Qty","Target","SL","P/L"]
.forEach(x=>{

let td=document.createElement("td");

let input=document.createElement("input");

input.dataset.key=
"trade_"+i+"_"+x;

td.appendChild(input);

tr.appendChild(td);

});

rowBox.appendChild(tr);

}


/* DATE + DAY */

function setDate(){

let now=new Date();

let date=now.toLocaleDateString("en-IN",{
day:"2-digit",
month:"2-digit",
year:"numeric"
});

let day=now.toLocaleDateString("en-IN",{
weekday:"long"
});

document.getElementById("date").value=date;

document.getElementById("day").value=day;

}

setDate();


/* LIVE EXACT TIME */

function updateClock(){

let now=new Date();

let text=now.toLocaleString("en-IN",{
day:"2-digit",
month:"2-digit",
year:"numeric",
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true
});

document.getElementById("clock").innerText=text;

}

updateClock();

setInterval(updateClock,1000);


/* ALL INPUT FIELDS */

function getFields(){

return document.querySelectorAll("[data-key]");

}


/* READ DATA */

function getData(){

let data={};

data.date=document.getElementById("date").value;

data.day=document.getElementById("day").value;

getFields().forEach(el=>{
data[el.dataset.key]=el.value;
});

return data;

}


/* CLEAR */

function clearForm(){

getFields().forEach(el=>{
el.value="";
});

setDate();

}


/* GET SAVED */

function getSaved(){

try{
return JSON.parse(localStorage.getItem(KEY)) || [];
}catch(e){
return [];
}

}


/* SAVE */

function saveNote(){

let data=getData();

let filled=false;

Object.keys(data).forEach(k=>{
if(String(data[k]).trim()!==""){
filled=true;
}
});

if(!filled){

document.getElementById("status").innerText=
"पहिले काहीतरी लिहा.";

return;

}


/* EXACT SAVE DATE TIME */

let now=new Date();

let savedTime=now.toLocaleString("en-IN",{
day:"2-digit",
month:"2-digit",
year:"numeric",
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true
});

let notes=getSaved();

notes.unshift({
id:Date.now(),
savedAt:savedTime,
data:data
});

localStorage.setItem(KEY,JSON.stringify(notes));


/* CLEAR AFTER SAVE */

clearForm();

document.getElementById("status").innerText=
"✓ SAVED • FORM CLEARED";

setTimeout(()=>{
document.getElementById("status").innerText="";
},2000);

}


/* OPEN SAVED */

function openSaved(){

showSaved();

document
.getElementById("savedModal")
.classList.add("show");

}


/* CLOSE */

function closeSaved(){

document
.getElementById("savedModal")
.classList.remove("show");

}


/* DISPLAY SAVED NOTES */

function showSaved(){

let list=document.getElementById("savedList");

let notes=getSaved();

list.innerHTML="";


if(notes.length===0){

list.innerHTML=
'<div class="empty">No saved notes yet.</div>';

return;

}


/* DELETE ALL */

let all=document.createElement("button");

all.className="deleteall";

all.innerText="🗑 DELETE ALL SAVED NOTES";

all.onclick=function(){

deleteId="ALL";

deleteIdConfirm();

};

list.appendChild(all);


/* NOTES */

notes.forEach((note,index)=>{

let card=document.createElement("div");

card.className="card";

let preview=
note.data.notes ||
note.data.movement ||
note.data.profit ||
"Trading Journal Entry";

card.innerHTML=

'<div class="cardtitle">Note '+(index+1)+'</div>'+
'<div class="cardtime">🕒 '+safe(note.savedAt)+'</div>'+
'<div class="preview">'+
safe(preview).substring(0,250)+
'</div>';


let open=document.createElement("button");

open.className="open";

open.innerText="OPEN";

open.onclick=function(){

openNote(note.id);

};


let del=document.createElement("button");

del.className="del";

del.innerText="🗑 DELETE";

del.onclick=function(){

deleteId=note.id;

deleteIdConfirm();

};


card.appendChild(open);

card.appendChild(del);

list.appendChild(card);

});

}


/* SIMPLE DELETE CONFIRM */

function deleteIdConfirm(){

let ok=confirm(
deleteId==="ALL"
?
"सगळ्या saved notes delete करायच्या?"
:
"ही saved note delete करायची?"
);

if(!ok){

deleteId=null;

return;

}


if(deleteId==="ALL"){

localStorage.removeItem(KEY);

}else{

let notes=getSaved();

notes=notes.filter(x=>x.id!==deleteId);

localStorage.setItem(KEY,JSON.stringify(notes));

}

deleteId=null;

showSaved();

}


/* OPEN SAVED NOTE */

function openNote(id){

let notes=getSaved();

let note=notes.find(x=>x.id===id);

if(!note)return;

clearForm();

getFields().forEach(el=>{

let key=el.dataset.key;

if(note.data[key]!==undefined){

el.value=note.data[key];

}

});

if(note.data.date){
document.getElementById("date").value=note.data.date;
}

if(note.data.day){
document.getElementById("day").value=note.data.day;
}

closeSaved();

document.getElementById("status").innerText=
"✓ Saved note opened";

}


/* SAFE TEXT */

function safe(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* BACK */

function goBack(){

if(history.length>1){
history.back();
}

}

</script>

</body>
</html>
